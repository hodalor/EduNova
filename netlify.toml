# Deploy the React app from the repository root.
# Tertiary frontend talks to the Render API.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  GENERATE_SOURCEMAP = "false"
  REACT_APP_API_URL = "https://edunova-e4bo.onrender.com/api"
  REACT_APP_SOCKET_URL = "https://edunova-e4bo.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
