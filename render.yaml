# Render Blueprint for the EDUOVA API, Postgres, and Redis.
# After the first deploy, set FRONTEND_URL and CORS_ORIGINS to the live Netlify origin.
services:
  - type: web
    name: eduova-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npx sequelize-cli db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: eduova-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eduova-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: MOBILE_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://eduova.netlify.app
      - key: CORS_ORIGINS
        value: https://eduova.netlify.app
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_USER
        value: mailer@example.com
      - key: SMTP_PASS
        value: change-me
      - key: TWILIO_SID
        value: change-me
      - key: TWILIO_TOKEN
        value: change-me
      - key: TWILIO_PHONE
        value: "+10000000000"
      - key: MAX_FILE_SIZE
        value: "5242880"

  - type: keyvalue
    name: eduova-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: eduova-postgres
    plan: free
    region: oregon
    databaseName: eduova
    user: eduova
